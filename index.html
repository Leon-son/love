<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💗 给最爱的你 💗</title>
    <style>
        /* --- 基础设置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #ffdde1 0%, #ee9ca7 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        /* --- 容器 --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- 头部 --- */
        header {
            text-align: center;
            padding: 30px 0;
            color: #ff0066;
            font-size: 24px;
            font-weight: bold;
        }

        /* --- 卡片通用 --- */
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        h2 {
            color: #ff6b81;
            margin-bottom: 15px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- 照片墙 --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }
        
        .gallery img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .gallery img:hover {
            transform: scale(1.05);
        }

        /* --- 视频区 --- */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .video-item {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .video-item video {
            width: 100%;
            display: block;
            border-radius: 15px;
        }

        /* --- 底部 --- */
        footer {
            text-align: center;
            padding: 20px;
            color: #ff6b81;
            font-size: 14px;
        }

        /* --- 蝴蝶装饰 --- */
        .butterfly {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 999;
            animation: float 6s linear infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* --- 弹窗遮罩 --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal img, .modal video {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 蝴蝶背景 -->
    <div id="butterflies"></div>

    <div class="container">
        <!-- 顶部天数 -->
        <header>
            ❤️ 我们已经在一起了 469 天 ❤️
        </header>

        <!-- 情书 -->
        <div class="card">
            <h2>💌 亲爱的</h2>
            <div style="line-height: 1.8;">
                从我遇见你的那天起，世界就悄悄变成了粉红色。
                你是我的小幸运，也是我最大的安心。
                无论未来有多少未知，我都想和你一起慢慢走。
                <strong>我爱你，不止今天，而是余生每一天。💕</strong>
            </div>
        </div>

        <!-- 照片画廊 -->
        <div class="card">
            <h2>📸 甜蜜画廊</h2>
            <div class="gallery">
                <!-- ★★★ 重点：在这里写死你的照片 ★★★ -->
                <!-- 假设你的照片叫 1.jpg, 2.jpg ... 放在 photos 文件夹里 -->
                <!-- 复制下面这一行，改数字和名字就可以添加更多 -->
                
                <!-- 示例图片占位符 (请替换为你的真实图片) -->
                <img src="./photos/1.jpg" alt="回忆1" onclick="openModal(this.src)">
                <img src="./photos/2.jpg" alt="回忆2" onclick="openModal(this.src)">
                <img src="./photos/3.jpg" alt="回忆3" onclick="openModal(this.src)">
                <img src="./photos/4.jpg" alt="回忆4" onclick="openModal(this.src)">
                <img src="./photos/5.jpg" alt="回忆5" onclick="openModal(this.src)">
                <img src="./photos/6.jpg" alt="回忆6" onclick="openModal(this.src)">
                <!-- 如果你有更多，继续复制上面那行 -->

            </div>
        </div>

        <!-- 视频区 -->
        <div class="card">
            <h2>🎬 心动瞬间</h2>
            <div class="video-list">
                <!-- ★★★ 重点：在这里写死你的视频 ★★★ -->
                <!-- 假设你的视频叫 1.mp4, 2.mp4 ... 放在 videos 文件夹里 -->
                
                <!-- 示例视频占位符 (请替换为你的真实视频) -->
                <div class="video-item">
                    <video controls poster="./photos/1.jpg"> <!-- 这里可以放个封面图 -->
                        <source src="./videos/1.mp4" type="video/mp4">
                        您的浏览器不支持视频播放。
                    </video>
                </div>
                <div class="video-item">
                    <video controls poster="./photos/2.jpg">
                        <source src="./videos/2.mp4" type="video/mp4">
                        您的浏览器不支持视频播放。
                    </video>
                </div>
                <!-- 如果有更多视频，继续复制上面这个 div -->

            </div>
        </div>

        <footer>
            Made with 💖 just for you
        </footer>
    </div>

    <!-- 弹窗 -->
    <div id="myModal" class="modal" onclick="closeModal()">
        <img id="modalImg" style="display:none;">
        <video id="modalVideo" controls style="display:none;"></video>
    </div>

    <script>
        // 1. 生成飞舞的蝴蝶
        function createButterflies() {
            const container = document.getElementById('butterflies');
            const butterflySrc = 'https://img.icons8.com/color/48/000000/butterfly.png'; // 在线图标，避免找不到文件
            
            for(let i=0; i<15; i++) {
                const b = document.createElement('img');
                b.src = butterflySrc;
                b.className = 'butterfly';
                b.style.left = Math.random() * 100 + '%';
                b.style.animationDelay = Math.random() * 5 + 's';
                b.style.width = (20 + Math.random() * 30) + 'px';
                container.appendChild(b);
            }
        }

        // 2. 图片点击放大
        function openModal(src) {
            const modal = document.getElementById('myModal');
            const img = document.getElementById('modalImg');
            const video = document.getElementById('modalVideo');
            
            // 隐藏视频，显示图片
            video.style.display = 'none';
            video.pause();
            
            img.src = src;
            img.style.display = 'block';
            modal.style.display = 'flex';
        }

        // 3. 点击关闭弹窗
        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }

        // 启动
        window.onload = createButterflies;
    </script>
</body>
</html>
