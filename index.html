<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>💗 给最爱的你 💗</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* ================= 基础 ================= */
body {
    margin: 0;
    font-family: "Comic Sans MS", "PingFang SC", sans-serif;
    background: linear-gradient(#fff0f5, #ffe4ec);
    overflow-x: hidden;
}

/* ================= Hello Kitty 插画背景 ================= */
.kitty-bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 80%, #ffd1dc 20%, transparent 21%),
        radial-gradient(circle at 80% 80%, #ffd1dc 20%, transparent 21%),
        radial-gradient(circle at 50% 10%, #fff 30%, transparent 31%),
        linear-gradient(#fff0f5, #ffe4ec);
    z-index: -2;
}

/* ================= 蝴蝶结 ================= */
.bow {
    position: fixed;
    top: -40px;
    font-size: 26px;
    animation: fall linear infinite;
    opacity: 0.9;
    z-index: 0;
}

@keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
}

/* ================= 锁屏 ================= */
#lockScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.6);
}

.lock-box {
    background: #fff;
    width: 85%;
    max-width: 360px;
    padding: 30px 20px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(255,182,193,0.5);
}

.lock-box h1 {
    font-size: 1.5rem;
    color: #ff6f91;
}

.lock-box input {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border-radius: 30px;
    border: 2px solid #ffb6c1;
    text-align: center;
    font-size: 1rem;
}

.lock-box button {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(120deg,#ffb6c1,#ff6f91);
    color: #fff;
    font-size: 1.1rem;
}

/* ================= 主内容 ================= */
#mainContent {
    display: none;
    padding-bottom: 60px;
}

header {
    padding: 45px 20px 35px;
    text-align: center;
}

header h1 {
    font-size: 2rem;
    color: #ff6f91;
}

/* ================= 在一起天数 ================= */
.days-box {
    margin: 25px auto;
    width: 85%;
    background: #fff;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(255,182,193,0.35);
    font-size: 1.2rem;
    color: #e88ca3;
}

/* ================= 打字机情书 ================= */
.love-letter {
    margin: 30px auto;
    width: 85%;
    background: #fff;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 8px 20px rgba(255,182,193,0.35);
    font-size: 1.05rem;
    line-height: 1.9;
    min-height: 160px;
}

/* ================= 上传 ================= */
.upload-section {
    margin: 30px auto;
    width: 85%;
    background: #fff;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 8px 20px rgba(255,182,193,0.35);
}

.upload-card {
    border: 2px dashed #ffb6c1;
    border-radius: 20px;
    padding: 20px;
    margin-top: 15px;
    background: #fff5f8;
}

/* ================= 画廊 ================= */
.gallery {
    margin: 40px auto;
    width: 90%;
}

.media-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.media-item {
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(255,182,193,0.35);
}

.media-item img,
.media-item video {
    width: 100%;
    display: block;
}

footer {
    text-align: center;
    margin-top: 40px;
    color: #a86a7e;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<div class="kitty-bg"></div>

<!-- 🎀 蝴蝶结 -->
<script>
for (let i = 0; i < 12; i++) {
    const bow = document.createElement("div");
    bow.className = "bow";
    bow.style.left = Math.random() * 100 + "vw";
    bow.style.animationDuration = (5 + Math.random() * 5) + "s";
    bow.innerHTML = "🎀";
    document.body.appendChild(bow);
}
</script>

<!-- 🔒 锁屏 -->
<div id="lockScreen">
    <div class="lock-box">
        <h1>💗 我们的秘密入口 💗</h1>
        <input id="pwd" type="password" placeholder="密码">
        <button onclick="unlock()">进入</button>
    </div>
</div>

<!-- 🎵 音乐 -->
<audio id="bgm" loop>
    <source src="./love.mp3" type="audio/mpeg">
</audio>
<!-- 🌸 主内容 -->
<div id="mainContent">

<header>
    <h1>🌸 Hello Kitty 的小心意 🌸</h1>
</header>

<div class="days-box" id="daysBox"></div>

<section class="love-letter" id="letter"></section>

<section class="upload-section">
    <h2>📸 上传我们的回忆</h2>

    <div class="upload-card">
        <strong>照片</strong><br>
        <input type="file" accept="image/*" multiple onchange="preview(event,'photo')">
    </div>

    <div class="upload-card">
        <strong>视频</strong><br>
        <input type="file" accept="video/*" multiple onchange="preview(event,'video')">
    </div>
</section>

<section class="gallery">
    <h2>💝 甜蜜画廊 💝</h2>
    <div id="mediaGrid" class="media-grid"></div>
</section>

<footer>
    Made with 💕 just for you
</footer>

</div>

<script>
/* ================= 密码 ================= */
function unlock() {
    if (document.getElementById("pwd").value === "12080812") {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        document.getElementById("bgm").play();
        calcDays();
        typeWriter();
    } else {
        alert("密码不对哦 🥲");
    }
}

/* ================= 在一起天数 ================= */
function calcDays() {
    const start = new Date("2025-01-24");
    const now = new Date();
    const days = Math.floor((now - start) / 86400000);
    document.getElementById("daysBox").innerText =
        "💖 我们已经在一起了 " + days + " 天 💖";
}

/* ================= 打字机情书 ================= */
const text =
"亲爱的：\n\n" +
"从我遇见你的那天起，世界就悄悄变成了粉红色。\n" +
"你是我的小幸运，也是我最大的安心。\n" +
"无论未来有多少未知，我都想和你一起慢慢走。\n\n" +
"我爱你，不止今天，而是余生每一天。💕";

let index = 0;
function typeWriter() {
    if (index < text.length) {
        document.getElementById("letter").innerHTML +=
            text.charAt(index) === "\n" ? "<br>" : text.charAt(index);
        index++;
        setTimeout(typeWriter, 60);
    }
}

/* ================= 预览 ================= */
function preview(event, type) {
    const grid = document.getElementById("mediaGrid");
    Array.from(event.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
            const div = document.createElement("div");
            div.className = "media-item";
            div.innerHTML =
                type === "photo"
                    ? `<img src="${e.target.result}">`
                    : `<video controls src="${e.target.result}"></video>`;
            grid.appendChild(div);
        };
        reader.readAsDataURL(file);
    });
}
</script>

</body>
</html>
